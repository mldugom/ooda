[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooda-ai"
version = "0.4.2"
description = "Provider-neutral OODA control system for bounded AI-assisted work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/mldugom/ooda"
Repository = "https://github.com/mldugom/ooda"

[project.scripts]
ooda = "ooda.entrypoint:main"
grok-safe = "ooda.grok_safe:main"
deepseek-safe = "ooda.deepseek_safe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ooda = [
  "resources/EFFICIENT_AGENT.md",
  "resources/grok/skills/ooda/SKILL.md",
  "resources/grok/skills/ooda-controller/SKILL.md",
  "resources/deepseek/skills/ooda/SKILL.md",
  "resources/deepseek/skills/ooda-controller/SKILL.md",
]
