[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooda-ai"
version = "0.1.0"
description = "Provider-neutral OODA operating system for bounded AI-assisted work"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "mldugom"}]
dependencies = []

[project.scripts]
ooda = "ooda.cli:main"
grok-safe = "ooda.grok_safe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ooda = ["GROK_SAFE.md"]
